<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgu_EbB69kzEOFcCHDgvQZObh43Q6Q6kpt_aUOoHI_L5y9I8elULeWuKl89zDQKuJFTcY3M_SHWYevzonb06bnNBDIEYWbAZSS3mBNsUTwMxRW2HCpM7fryALmjZLSlJpFk9sQ1POTpYRBd3IE_T3Pd5QjwAhzSv-SZz1a_JK5IwZLpoPhHMa_vw6r939JY/s320/Untitled_design__2_-removebg-preview%20(1).png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Arsip Digital</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Aplikasi Manajemen Arsip Digital untuk Rendatin" />
    <meta name="theme-color" content="#f3f4f6" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arsip Digital" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Preconnect to Google Fonts (early DNS lookup) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Load Inter font with font-display=swap for better fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    
    <!-- Load Material Symbols with font-display=block and longer timeout -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    
    <!-- Preload critical fonts to ensure they load first -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" as="style" />
    
    <!-- Inline critical CSS to prevent flash -->
    <style>
      /* Force fonts to be available before showing content */
      @font-face {
        font-family: 'Material Symbols Outlined Fallback';
        src: local('Arial');
        size-adjust: 100%;
        ascent-override: 100%;
        descent-override: 20%;
        line-gap-override: 0%;
      }
      
      /* Hide body until fonts loaded */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        visibility: visible;
        opacity: 1;
        transition: opacity 0.2s ease-in;
        margin: 0;
        padding: 0;
      }
      
      /* Prevent icon flash - CRITICAL: Hide icons until font loaded */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', 'Material Symbols Outlined Fallback';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'liga';
        /* CRITICAL: Hide text if font not loaded */
        text-indent: 0;
        overflow: hidden;
      }
      
      /* Hide icons completely until fonts loaded - RELAXED */
      body:not(.fonts-ready) .material-symbols-outlined {
        opacity: 0;
        width: 24px;
        height: 24px;
      }
      
      body.fonts-ready .material-symbols-outlined {
        opacity: 1;
        transition: opacity 0.2s ease-in;
      }
      
      /* Force icon sizes with !important */
      .material-symbols-outlined.\!text-\[48px\] {
        font-size: 48px !important;
      }
      
      .material-symbols-outlined.\!text-\[32px\] {
        font-size: 32px !important;
      }
      
      /* Media query for desktop */
      @media (min-width: 768px) {
        .material-symbols-outlined.md\:\!text-\[32px\] {
          font-size: 32px !important;
        }
      }
      
      /* Loading screen - IMPROVED with offline support */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      #app-loader.loaded {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #e0e0e0;
        border-top: 4px solid #6750a4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .loader-text {
        margin-top: 16px;
        color: #6750a4;
        font-size: 14px;
        font-weight: 500;
      }
      
      .loader-status {
        margin-top: 8px;
        color: #9e9e9e;
        font-size: 12px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide app content until ready - SIMPLIFIED */
      #root {
        opacity: 0;
        min-height: 100vh;
        transition: opacity 0.3s ease-in;
      }
      
      #root.fonts-loaded {
        opacity: 1;
      }
      
      /* Force loader to stay visible longer - SIMPLIFIED */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fafafa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      /* Offline indicator */
      .offline-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #d32f2f;
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 12px;
        z-index: 10000;
        display: none;
      }
      
      .offline-banner.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Offline Indicator -->
    <div id="offline-banner" class="offline-banner">
      ⚠️ Tidak ada koneksi internet. Beberapa fitur mungkin tidak tersedia.
    </div>
    
    <!-- Loading Screen -->
    <div id="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Memuat Arsip Digital...</div>
      <div class="loader-status" id="loader-status">Memeriksa koneksi...</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('ServiceWorker registration successful:', registration.scope);
            })
            .catch(function(err) {
              console.log('ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
    
    <!-- Remove loader after fonts loaded -->
    <script>
      // SIMPLIFIED: Just show app after short delay, no complex font loading
      console.log('🚀 App starting...');
      
      // Check online/offline status
      function updateOnlineStatus() {
        const offlineBanner = document.getElementById('offline-banner');
        
        if (!navigator.onLine) {
          if (offlineBanner) offlineBanner.classList.add('show');
        } else {
          if (offlineBanner) offlineBanner.classList.remove('show');
        }
      }
      
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();
      
      // Simple approach: Just wait a bit and show app
      let appShown = false;
      
      function showApp() {
        if (appShown) return;
        appShown = true;
        
        console.log('✅ Showing app');
        
        const loader = document.getElementById('app-loader');
        const root = document.getElementById('root');
        
        document.body.classList.add('fonts-ready');
        
        if (root) {
          root.classList.add('fonts-loaded');
        }
        
        if (loader) {
          loader.classList.add('loaded');
          setTimeout(function() {
            loader.remove();
          }, 300);
        }
      }
      
      // Try to load fonts in background (don't wait for them)
      document.fonts.load('400 24px "Material Symbols Outlined"').then(function() {
        console.log('✅ Material Symbols loaded');
      }).catch(function(err) {
        console.warn('⚠️ Material Symbols load failed:', err);
      });
      
      document.fonts.load('400 1em Inter').then(function() {
        console.log('✅ Inter font loaded');
      }).catch(function(err) {
        console.warn('⚠️ Inter font load failed:', err);
      });
      
      // CRITICAL: Always show app after 1.5 seconds maximum
      setTimeout(function() {
        console.log('⏰ Timeout reached, showing app');
        showApp();
      }, 1500); // 1.5 seconds max wait
      
      // Backup: Force show if somehow still not shown after 3 seconds
      setTimeout(function() {
        if (!appShown) {
          console.error('❌ EMERGENCY: Forcing app show after 3 seconds');
          showApp();
        }
      }, 3000);
    </script>
  </body>
</html>
